<!doctype html>
<html lang="pl">
  <head>
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="apple-touch-icon" href="logo.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nowe hasło - Razem w Głowie</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body class="light-mode">
    <div class="login-container">
      <h1>Ustaw nowe hasło</h1>
      <p class="subtitle">Wpisz i powtórz swoje nowe hasło.</p>

      <div id="message" class="success-message"></div>
      <div id="error" class="error-message"></div>

      <form id="newPasswordForm">
        <div class="input-group">
          <label for="password">Nowe hasło</label>
          <input
            type="password"
            id="password"
            required
            minlength="6"
            placeholder="Min. 6 znaków"
            autocomplete="new-password"
          />
        </div>
        <div class="input-group">
          <label for="confirmPassword">Powtórz hasło</label>
          <input
            type="password"
            id="confirmPassword"
            required
            minlength="6"
            placeholder="Powtórz hasło"
            autocomplete="new-password"
          />
        </div>
        <button type="submit" class="login-btn" id="saveBtn">Zapisz hasło</button>
      </form>
    </div>

    <script type="module">
      import {
        confirmPasswordReset,
        verifyPasswordResetCode,
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
      import { auth } from "./firebase-config.js";

      const messageEl = document.getElementById("message");
      const errorEl = document.getElementById("error");
      const form = document.getElementById("newPasswordForm");
      const saveBtn = document.getElementById("saveBtn");

      const setMessage = (text) => {
        if (messageEl) {
          messageEl.textContent = String(text || "");
          messageEl.style.display = text ? "block" : "none";
        }
        if (errorEl) errorEl.style.display = "none";
      };

      const setError = (text) => {
        if (errorEl) {
          errorEl.textContent = String(text || "");
          errorEl.style.display = text ? "block" : "none";
        }
        if (messageEl) messageEl.style.display = "none";
      };

      const urlParams = new URLSearchParams(window.location.search);
      const actionCode = urlParams.get("oobCode");

      if (!actionCode) {
        if (form) form.style.display = "none";
        setError("Brak kodu resetu hasla w linku.");
      } else {
        try {
          await verifyPasswordResetCode(auth, actionCode);
        } catch {
          if (form) form.style.display = "none";
          setError("Link wygasł lub został już użyty.");
        }
      }

      if (form) {
        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (!actionCode) return;

          const newPassword = String(document.getElementById("password")?.value || "");
          const confirmPassword = String(
            document.getElementById("confirmPassword")?.value || "",
          );

          if (newPassword.length < 6) {
            setError("Hasło musi mieć co najmniej 6 znaków.");
            return;
          }

          if (newPassword !== confirmPassword) {
            setError("Hasła nie są identyczne.");
            return;
          }

          setError("");
          if (saveBtn) saveBtn.disabled = true;

          try {
            await confirmPasswordReset(auth, actionCode, newPassword);
            setMessage(
              "Hasło zostało zmienione. Za chwilę nastąpi przekierowanie do logowania...",
            );
            window.setTimeout(() => {
              window.location.href = "login.html";
            }, 2500);
          } catch {
            setError("Nie udało się zmienić hasła. Link mógł wygasnąć.");
          } finally {
            if (saveBtn) saveBtn.disabled = false;
          }
        });
      }
    </script>
  </body>
</html>
